name: Weekly rebuild

on:
  schedule:
    # 06:00 UTC every Monday - picks up AL2023 package updates even when
    # nobody has touched packer/ or ansible/ that week.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  build:
    uses: ./.github/workflows/build-ami.yml
    with:
      arch: both
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  check-runner-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned runner version to latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -m1 '^variable "runner_version"' -A3 packer/variables.pkr.hcl \
            | grep default | sed -E 's/.*"([^"]+)".*/\1/')
          latest=$(gh api repos/actions/runner/releases/latest -q .tag_name | sed 's/^v//')

          echo "pinned=${pinned} latest=${latest}"
          if [ "${pinned}" != "${latest}" ]; then
            title="actions/runner v${latest} available (pinned: v${pinned})"
            if ! gh issue list --search "in:title \"${title}\"" --state open --json number --jq '.[].number' | grep -q .; then
              gh issue create \
                --title "${title}" \
                --body "This repo pins actions/runner to v${pinned} (packer/variables.pkr.hcl and ansible/group_vars/all.yml). Upstream has released v${latest}. Bump runner_version and the per-arch checksums (from the GitHub release notes) in both files." \
                --label dependencies
            fi
          fi
