---
- name: Create /opt/actions-runner owned by runner
  file:
    path: /opt/actions-runner
    state: directory
    owner: runner
    group: runner
    mode: "0755"

- name: Download GitHub Actions runner tarball (checksum-verified)
  get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    dest: "/tmp/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    checksum: "sha256:{{ runner_checksum }}"
    mode: "0644"

- name: Extract runner into /opt/actions-runner
  unarchive:
    src: "/tmp/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    dest: /opt/actions-runner
    remote_src: true

- name: Remove downloaded tarball
  file:
    path: "/tmp/actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    state: absent

- name: Own the runner install by the runner user
  file:
    path: /opt/actions-runner
    owner: runner
    group: runner
    recurse: true

- name: Install native runner dependencies
  command: /opt/actions-runner/bin/installdependencies.sh
  changed_when: true

- name: Create ephemeral work directory
  file:
    path: /opt/actions-runner/_work
    state: directory
    owner: runner
    group: runner
    mode: "0750"

- name: Create /opt/github-runner/bin for lifecycle scripts
  file:
    path: /opt/github-runner/bin
    state: directory
    mode: "0755"

- name: Install runner lifecycle scripts
  copy:
    src: "{{ item }}"
    dest: "/opt/github-runner/bin/{{ item }}"
    mode: "0755"
  loop:
    - runner-register.sh
    - runner-start.sh
    - runner-cleanup.sh
    - fetch-runner-token.sh

- name: Create /etc/github-runner (runner.env is written by Terraform user_data at boot)
  file:
    path: /etc/github-runner
    state: directory
    mode: "0755"

- name: Install github-runner systemd unit
  copy:
    src: github-runner.service
    dest: /etc/systemd/system/github-runner.service
    mode: "0644"

- name: Reload systemd
  systemd:
    daemon_reload: true

# Intentionally not enabled here - see packer/scripts/85-install-runner-service.sh
# for why the unit is started explicitly by Terraform's user_data instead.
