---
# noqa: package-latest - patching every package is the point of the weekly rebuild.
- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - jq
      - unzip
      - tar
      - gzip
      - which
      - shadow-utils
      - util-linux
      - chrony
      - amazon-ssm-agent
      - findutils
      - procps-ng
      - dnf-plugins-core
      - gnupg2
    state: present

- name: Enable chronyd and amazon-ssm-agent
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - chronyd
    - amazon-ssm-agent

- name: Create unprivileged runner system user
  ansible.builtin.user:
    name: runner
    system: true
    create_home: true
    home: /home/runner
    shell: /sbin/nologin
    state: present

- name: Clean dnf cache
  ansible.builtin.command: dnf clean all
  changed_when: false
