---
- name: Install Docker Engine
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true

- name: Create Docker CLI plugins directory
  ansible.builtin.file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Download docker-buildx plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/buildx/releases/download/v{{ buildx_version }}/buildx-v{{ buildx_version }}.linux-{{ go_arch }}"
    dest: "/usr/libexec/docker/cli-plugins/docker-buildx"
    checksum: "sha256:{{ buildx_checksum }}"
    mode: "0755"

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add runner user to docker group
  ansible.builtin.user:
    name: runner
    groups: docker
    append: true

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
  # ec2-user is absent on some base images; the runner user is the one that matters.
  failed_when: false

- name: Install Docker daemon.json
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
