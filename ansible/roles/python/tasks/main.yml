---
- name: Install Python 3 and tooling
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-setuptools
      - python3-virtualenv
    state: present

# noqa: package-latest - an AMI build deliberately bakes in the newest pip.
- name: Upgrade pip
  ansible.builtin.pip:
    name: pip
    state: latest
    executable: pip3

- name: Symlink python -> python3
  ansible.builtin.file:
    src: /usr/bin/python3
    dest: /usr/local/bin/python
    state: link
