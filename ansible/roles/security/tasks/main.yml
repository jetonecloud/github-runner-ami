---
# No SSH, SSM Session Manager only. IMDSv2 enforcement is set at the EC2
# attribute level (packer/sources.pkr.hcl / the Terraform launch template),
# not here.
- name: Disable sshd (SSM Session Manager is the only remote access path)
  ansible.builtin.systemd:
    name: sshd.service
    enabled: false
  # Minimal AL2023 images may not ship sshd at all - nothing to disable then.
  failed_when: false

- name: Harden sshd_config defensively (in case sshd is ever re-enabled)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^#?PermitRootLogin.*", line: "PermitRootLogin no" }
    - { regexp: "^#?PasswordAuthentication.*", line: "PasswordAuthentication no" }
    - { regexp: "^#?X11Forwarding.*", line: "X11Forwarding no" }
    - { regexp: "^#?AllowTcpForwarding.*", line: "AllowTcpForwarding no" }

- name: Ensure amazon-ssm-agent is enabled
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true

- name: Lock down runner home and install directories
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0750"
  loop:
    - /home/runner
    - /opt/actions-runner
