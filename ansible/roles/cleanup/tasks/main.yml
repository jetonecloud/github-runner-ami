---
- name: Clean dnf cache
  ansible.builtin.command: dnf clean all
  changed_when: false

- name: Remove dnf/tmp caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/cache/dnf
    - /tmp
    - /var/tmp

- name: Recreate /tmp and /var/tmp with correct permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "1777"
  loop:
    - /tmp
    - /var/tmp

- name: Remove static SSH host keys (sshd is disabled; no reason to ship them)
  ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
  changed_when: false

- name: Reset cloud-init state so every launched instance is a fresh first boot
  ansible.builtin.command: cloud-init clean --logs
  # Best effort: a half-initialized cloud-init state is still worth clearing.
  failed_when: false
  changed_when: true

- name: Remove cloud-init instance state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/cloud/instance

- name: Truncate machine-id (systemd regenerates it on first boot)
  ansible.builtin.copy:
    content: ""
    dest: /etc/machine-id
    mode: "0444"
  # Already-read-only machine-id must not abort the cleanup pass.
  failed_when: false

- name: Remove dbus machine-id
  ansible.builtin.file:
    path: /var/lib/dbus/machine-id
    state: absent

- name: Truncate log files
  ansible.builtin.shell: find /var/log -type f -exec truncate -s 0 {} \;
  changed_when: false

- name: Remove shell history
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.bash_history
    - /home/ec2-user/.bash_history
    - /home/runner/.bash_history
